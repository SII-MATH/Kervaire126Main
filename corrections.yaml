  problem: |-
    **原文与问题。** 原文标签 `prop:dec738d3`，断言 $d_n^{f,E_r}(x)=y$ 可下降到所有 $2\le r'<r$。但 Definition 5.4 要求 $e(f)\le n\le r'-2+e(f)$。例如 $r=3,n=e(f)+1,r'=2$，晚页合法，早页已超出定义域；这是量化范围问题。
  progress: |-
