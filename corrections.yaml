  problem: |-
    原文的全篇背景是 2 完备、connective、finite-type 谱。原泛型 Lean 模型没有包含这些背景所需的实际 Adams 滤过收敛条件：逐页永久性允许每页选择不同代表，不能仅用同伦正合性选出同一个被 g 杀死的代表。问题属于形式化遗漏背景条件，并非已发现满足原论文全部背景的反例。
  counterexample: |-
