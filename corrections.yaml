  problem: |-
    **原文与问题。** Proposition 5.10（`prop:cross-f-Er`）从交换的 λ 方块直接提升扩张，但除以 λ 后的像可能出现低滤过 λ-torsion，不能保证所需的像滤过。此问题也影响 Theorem 6.1（`thm:e73f481e`）原文的无 crossing 前提；本轮已独立核验一个满足完整 GL 前提的一般实际谱反例，而不只是反驳其证明中的某一步。
  counterexample: |-
    令 $E=H\mathbb Z_2^\wedge$、$T=H(\mathbb Z/4)$，取标准三角的商映射 $j:E\to T$ 与连接 $\delta:T\to\Sigma E$，以及

    $$
    X=T_a\oplus E_b,\qquad Y=\Sigma E_c\oplus T_d\oplus E_e,
    \qquad f(a,b)=(\delta a,jb,2b).
    $$

    这里 $e(f)=0$。取 $\mathrm{page}=r=2,m=0,l=2,(s,t)=(0,1)$，并取
    $x=v_a$、$x_\infty=h_0^2u_a=d_2(v_a)$、$y=c$、$y_\infty=h_0^4e$。
    有限扩张由 $Q_1\nu\delta$ 给出；无限扩张的实际源代表为
    $h_0^2u_a+\lambda h_0^3b$，其像为 $\lambda^2h_0^4e$。
    该无限扩张是 inessential，但 GL 没有要求 essential；原文明确 $B_\infty\subset Z_\infty$，所以被 $d_2$ 击中的 $x_\infty$ 也满足其永久循环前提。
    三个可能的经典无限 crossing 位置全部被低滤过 $T_d$ 分量或 $B_2,B_3$ 排除；经典 $d_2$ 在第二页的 no-crossing 条件为空。原结论却要求 $d_4(c)=h_0^4e$，而两个自由 $E$ 分量的 Adams 塔永久且无边界，故结论不成立。

    **证据与边界。** May–Milgram 的 HZ/HZ4 Adams 计算、BHS 的 synthetic 比较与收敛结果给出实际谱、指定映射及滤过的数学识别；有限系数穷举及独立 Lean 算术证据通过，但这些算术检查本身不等于谱反例的 Lean 形式化。上述 HZ 谱与直和不在当前 `ClassicalObject` 闭包中，因此尚未形式化反驳固定 `Standard.generalizedLeibniz`。详细前提表、独立复核和复现见 [GL/crossing 人审报告](local-history/metadata/interface-reviews/ProofTools/20261018-gl-crossing-lambda-lift/report.md)。

    **后续球面核验。** 独立审查又给出仅使用 $X=S^7$、$Y=S^0$、$f=\sigma$ 的数学反例，位于预期的球面/移位对象范围。取 $\mathrm{page}=r=2,m=1,l=3,(s,t)=(2,19)$，$x=y=x_\infty=0$，$y_\infty=Pc_0\in\mathrm{Ext}^{7,23}$。BHS Proposition A.20 给出
    $\widetilde\sigma\,\widetilde{Ph_1}=\widetilde\eta^2\widetilde\kappa+\lambda\widetilde{Pc_0}$ 与 $\lambda\widetilde\eta^2\widetilde\kappa=0$，故高滤过代表 $\lambda\widetilde{Ph_1}$ 在源的指定 grade 表示零，却映到 $\lambda^2\widetilde{Pc_0}$。原式允许该非 essential 扩张。全部三个经典 crossing 位置分别因低滤过项、$h_1^2d_0=d_2(e_0)\in B_2$ 或源群消失被排除；原结论却为 $d_4(0)=Pc_0\ne0$。全部代表由 BHS 完整低维环与滤过计算核对，经典边界及存活由 IWX 原始数据独立核对。

    BHS 的生成元表把 $Pc_0$ weight 印为 24；其两张图、三条齐次关系以及 IWX 的 $(\mathrm{stem},\mathrm{AF})=(16,7)$ 一致确定应为 23，审查明确保存原印值，不把排印修正隐藏在接口中。这是实际球面上的数学反例，尚未在 Lean 中将这些元素运输到待构造的 `Standard.model`；不能称为 kernel 已证明固定 GL 的否定。详见[独立球面核验](local-history/proof-sessions/gl-2026-10-18/fixed-object-review/sigma-audit/report.md)。

    **Proposition 5.10 的独立加强反例。** 在实际谱 $M=H\mathbb Z_2^\wedge\oplus H(\mathbb Z/4)\oplus H\mathbb Z_2^\wedge$ 上取 $f_*(a,\theta,c)=(4c,j(a),2a)$，$e(f_*)=0$，$(r,q,n,s,t)=(4,3,2,1,1)$。原非零永久标签与实际代表 $(0,0,1)\mapsto(4,0,0)$ 给出 essential 长度 2 扩张；同源 grade 的 16 个代表的目标 coset 不含零。同一大商在 $(u,v)=(2,3)$ 有 essential crossing，而 Definition 5.9 的全部三个小商候选 $(i,j)=(1,0),(1,1),(2,0)$ 均不存在。因此增加原扩张 essential 性仍不能修复该 iff。完整前提、谱识别、所有代表枚举与证据边界见 [已投递的独立审查 PDF](https://applink.feishu.cn/client/chat/open?openChatId=oc_0757f47818759dc02c05b8dd370aa649&position=1521)。这是满足论文全局谱条件的数学反例及有限枚举核验，尚非 Lean 完整 Model 反证，也不反驳固定 tmf detector 的实例。
