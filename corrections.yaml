- id: arbitrary-y-extension
  title: 任意检测代表的精确扩张需要实际消灭 h₀ 误差
  reference: COROLLARY 7.18 · PROOF
  status:
    kind: partial
    label: 精确误差条件已证 · 原结论待补
  original:
    statements:
    - '7.18'
    source_line: 2571
  revision:
    nodes: []
    note: 保留任意检测代表和未乘 λ² 的原等式；没有把已证的乘 λ² 版本替换为公共结论。
  problem: |-
    原证明从一个括号代表的精确关系推广到任意同标签代表时，仅有高滤过信息不足以消灭 $h_0$ 误差。在当前固定对象及分次下，所有 $T$ 检测代表的 $\lambda^6$ 像已经证明相同，因此不能依靠更换目标代表吸收任意非零误差。
  counterexample: |-
    独立 Lean 检查在实际 $Q_9$ 中构造了 $q\in F^{15}\pi_{125,132}Q_9$，且 $h_0q\ne0$。其标签为 $\lambda^8\operatorname{basis}(15,140,3)$；$h_0$ 像的标签为 $\lambda^8\operatorname{basis}(16,141,3)$，后者的非零 $d_2$ 排除其属于相关边界。有限商比较和实际作用检测给出同伦类，而不只是一张抽象滤过群表。

    因而，给定一个 $Y$ 检测代表 $y_0$ 及其精确 $T$ 目标，$y_0+q$ 仍有同一 $Y$ 检测，却没有任何满足原精确等式的 $T$ 目标。这反驳的是从一个代表的关系无条件推广到所有同标签代表的步骤；它没有提供同时满足原推论中第六微分消失与指定 $\eta$ 扩张检测条件的实例，不能称为原推论完整条件下的反例。证据继承既有上游待补，不调用两个待证结论或后续 Main 矛盾定理。可复现检查见 `local-history/proof-sessions/main-paper-proofs/audit/FiniteObstruction.lean`。
  progress: |-
    新增私有等价引理：给定初始精确非零关系 $h_0y_0=\lambda^6t_0$，另一代表 $y$ 存在原结论要求的目标，当且仅当 $h_0(y-y_0)=0$；同样的等价保留对所有 $Y$ 检测代表的量词。原有结果只保证此误差被 $\lambda^2$ 消灭，尚不能推出未乘 $\lambda^2$ 的零性。

    这是一项精确的剩余责任归约，不是原推论的否定。公共类型、接口锁及两项 Main 待补责任均保持不变；不调用后续条件不相容定理或主定理来替代原文路线。独立复核与证据范围见 `local-history/interface-reviews/2026-10-18-main-paper-proofs/`。
