          Lean 表示：
          ClassicalObject.detector.obj model.auxiliary = model.auxiliary.detector
          KIP126.Literature.Standard.tmf : Spectrum
          tmfIso : tmf ≅ model.auxiliary.detector
        code:
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: ClassicalObject.obj
