          - file: KIP126/E2Computation/Table.lean
            declaration: cofiber_basis_correct
          - file: KIP126/E2Computation/Standard.lean
            declaration: nuCofiberSequence
      - title: 已纳入对象 3 / 3：tmf → 检测谱及指定同构
        body: 'SS 中 tmf 是另一个环谱条目。Lean 先有 model.auxiliary.detector，再由文献模块给出 tmf 与 tmfIso: tmf ≅ detector。自然语言：将球面的类映到
          tmf，用 tmf 中的消失、非零性和谱序列信息约束球面中的类。Main 的高滤过论证实际使用这个检测谱。tmf、代数结构、同构及单位相容性是已有上游待构造或待证明输入，不能仅凭 detector 的名字认定它是
          tmf。'
        snippet: |-
          SS 原条目：
          {
            "deduce": "on",
            "latex": "tmf",
            "name": "tmf",
            "path": "tmf_AdamsSS_t261.db",
