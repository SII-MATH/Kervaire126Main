          Lean 表示：
          ClassicalObject.sphere
          ClassicalObject.sphere.obj model.auxiliary = SphereSpectrum
          model.classical.sphere.Page 2 (s,t)
        code:
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: ClassicalObject.obj
          - file: KIP126/AdamsSynthetic/Standard/Background.lean
            declaration: classical
      - title: 已纳入对象 2 / 3：Cnu → 指定 Hopf ν 的余纤维
        body: 'SS 中 Cnu 是 over: S0 的模块条目，指向 Cnu_AdamsSS_t200.db。Lean 中它固定为同一个 model.auxiliary.nuMap 的余纤维，而不是另外任取一个叫
          Cν 的对象。自然语言：从 Hopf 映射 ν: Σ³S⁰ → S⁰ 取余纤维，得到带底胞腔和顶胞腔映射的 Cν。有限 E₂ 表也把 .nuCofiber 解释为这个对象；基底构造及数据正确性仍有已登记的待补责任。'
        snippet: |-
          SS 原条目：
          {
            "deduce": "on",
            "name": "Cnu",
            "over": "S0",
            "path": "Cnu_AdamsSS_t200.db"
          }

          Lean 表示：
          ClassicalObject.nuCofiber
          HasFunctorialCofiber.cofib model.auxiliary.nuMap
          KIP126.Computation.Table.object .nuCofiber
          KIP126.Computation.Standard.nuCofiberSequence
        code:
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: AuxiliaryData
