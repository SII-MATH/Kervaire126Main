  - id: T10
    title: SS 原始配置及其与主证明接口的绑定
    status: to_discuss
    note: 与 T11 合并。上会审定已纳入对象、原配置与 Lean 的对应，以及其余 46 个具名谱暂不逐一引入的范围。
    details_label: 查看 SS 原配置、形式化对照与上会讨论点
    details:
      - title: 讨论范围与原配置版本
        body: 本次逐项展示现有接口所表达的对象、映射和数学含义，供会上审定与原配置的对应。已纳入指已有对象表达及相关上游接口，不代表真实谱、数据库比较和文献输入的底层构造全部完成。核对的 ss.json 含 2 个
          rings、47 个 modules、180 个 maps、115 个 maps_v2、61 个 cofseqs 和 36 个 commutativity 条目。该原文件目前位于本地审计材料，尚未作为受版本控制的
          SS 配置入口交付；本页摘录不替代原文件。会上还需确认应保存的原始版本及所用子集。
        snippet: |-
          核对文件：/tmp/mh2-machine-proof-audit/database-subset/kervaire-49/ss.json
          SHA-256：a9a623bf7165e62fcf455e454fdf9195237491bf07bd148902e245aa1dba64d8
      - title: 已纳入对象 1 / 3：S0 → 球面谱
