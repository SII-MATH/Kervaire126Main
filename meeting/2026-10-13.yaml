    title: 广义 GL／MH 带 level 修正版的组合、审核与 SS 应用认证
    status: to_discuss
    note: 已有公开带层 GL / MH；会上讨论如何从经典 Adams 微分与经典 no-crossing，经过带层工具组合回到经典微分，并闭合 SS 实际调用。
    details_label: 查看群讨论、Blueprint 对应及下一步工作
    details:
      - title: 本次讨论的最终目标：经典输入经过带层工具回到经典微分
        body: 王老师 10 月 20 日的最新要求是：从经典 Adams 微分和经典 no-crossing 推出经典 Adams 微分；E_r 扩张是 MH 与 GL 的中间状态。因此已有两个 AtLevel 定理只是可用的数学工具，下一步要证明它们的条件能由前面的经典输入推出，并能在同一实际商、weight、代表和标签上组合。这将原
          T13“一般证明工具相关的具体数学问题”具体化；不另增原会议编号。
        snippet: |-
          经典 Adams 微分 + 明确的经典 no-crossing 条件
            → 实际带 level 的 MH 输入及有限扩张
            → 与 GL 同商、同 weight、保留原标签和实际代表
            → 实际 GL no-crossing 与所需有限 / 无限比较
            → 经典 Adams 微分
        links:
          - title: 王老师最新要求：组合 MH 与 GL
            url: https://applink.feishu.cn/client/chat/open?openChatId=oc_0757f47818759dc02c05b8dd370aa649&position=1574
          - title: 林老师：Adams 微分进，Adams 微分出
            url: https://applink.feishu.cn/client/chat/open?openChatId=oc_0757f47818759dc02c05b8dd370aa649&position=1535
