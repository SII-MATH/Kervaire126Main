          是它的 Adams 谱序列，所用 E₂ 元素属于这个实际谱页。自然语言：以球面谱为主对象，研究它的稳定同伦群及 Adams 谱序列。固定范畴和 Adams 系统仍含已有待构造输入。
        snippet: |-
          SS 原条目：
          {
            "deduce": "on",
            "latex": "S^0",
            "name": "S0",
            "path": "S0_AdamsSS_t261.db",
            "plot_factors": [
