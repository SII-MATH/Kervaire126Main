  - id: T07
    title: 标准 hᵢ 的抽象输入、性质及数据标签对应
    status: to_discuss
    note: 页、次数、主证明所需性质与数据标签对应已核对；上会讨论并确认抽象输入边界。
    details_label: 查看上会讨论材料与代码依据
    details:
      - title: 页与次数：实际球面的 E₂ 元素
        body: >-
          ActualE2At A p 就是 A.sphere.Page 2 p；hiDegree i 为 (1, 2^i)。
          因此输入是实际球面 E₂ 页上的 hᵢ，而不是独立的形式符号。
          h₆ 属于 E₂^(1,64)，h₆² 属于 E₂^(2,128)，后者的 stem 为 128−2=126。
        code:
          - file: KIP126/AdamsSynthetic/Sphere.lean
            declaration: ActualE2At
          - file: KIP126/AdamsSynthetic/Sphere.lean
            declaration: hiDegree
          - file: KIP126/AdamsSynthetic/Sphere.lean
            declaration: standardHiSquare
      - title: 抽象规格与固定实例分别是什么
        body: >-
          StandardSphereClasses 是要求提供每个 hᵢ 的结构类型。
          standardClasses 是填好 standardHi 的具体实例；固定 model 的 standardClasses 字段保存这个实例。
          当前 standardHi 通过 sphereE2_milnorEquiv 的逆映射选定 Milnor 标准类。
          主证明直接使用 model.standardClasses，不需要调用者另外构造这些元素或先证明 Milnor 比较。
        snippet: |-
          public structure StandardSphereClasses (A : ClassicalAdamsFamily C)
              (_P : SphereE2Algebra A) where
            hi : ∀ i : ℕ, ActualE2At A (hiDegree i)

          public def standardClasses :
              StandardSphereClasses classical sphereAlgebra := ⟨standardHi⟩
        code:
          - file: KIP126/AdamsSynthetic/Sphere.lean
            declaration: StandardSphereClasses
          - file: KIP126/AdamsSynthetic/Standard/Background.lean
            declaration: standardHi
          - file: KIP126/AdamsSynthetic/Standard/Background.lean
            declaration: standardClasses
          - file: KIP126/AdamsSynthetic/Standard/Background.lean
            declaration: model
      - title: 必要性质：同一乘法、非零性与检测标定
        body: >-
          SphereE2Algebra 提供这个 E₂ 页的标量、乘法、单位及代数规律。
          standardH6Square_eq_product 明确 h₆² 是同一个 h₆ 的乘积；square_nonzero 提供它在 E₂ 上非零。
          文献接口提供 h₁ 对 η、h₂ 对经典 ν 的检测，以及合成 η 的首个 λ 商标签和 h₅² 的非零永久存活。
          StandardSphereClasses 本身只指定元素，不暗中假设所有 hᵢ 或其平方非零、也不假设它们全部永久存活。
        code:
          - file: KIP126/AdamsSynthetic/Sphere.lean
            declaration: SphereE2Algebra
          - file: KIP126/AdamsSynthetic/Sphere.lean
            declaration: standardH6Square_eq_product
          - file: KIP126/E2Computation/Standard.lean
            declaration: square_nonzero
          - file: KIP126/Literature/Standard.lean
            declaration: eta_detection
          - file: KIP126/Literature/Standard.lean
            declaration: nu_detection
          - file: KIP126/Literature/Standard.lean
            declaration: eta_label
          - file: KIP126/Literature/Standard.lean
            declaration: h5Square_permanent
      - title: 数据标签怎样接到指定元素
        body: >-
          Atom.record 记录归档编号、名字和 (s,t) 次数；本次具名标签 h₀、h₁、h₂、h₄、h₅、h₆
          的编号分别为 0、1、2、7、18、69，h₆ 的记录为 (69, "h_6", 1, 64)。
          SpherePresentation 指定源数据到同一实际 E₂ 页的线性同构，范围为 t≤261，并要求单位和乘法相容；乘积的总次数也须在界内。
          comparison_h* 和 atom_h*（*=0、1、2、4、5、6）明确对应六个标准类。
          h6_square 进一步把数据中的平方送到指定的 h₆²，不凭同名标签推断相等。
        snippet: |-
          public theorem atom_h6 : atom .h6 = h6 := presentation.h6

          public theorem h6_square : comparison 2 128 (by decide)
              (sourceData.product 1 64 1 64 (sourceData.atom .h6) (sourceData.atom .h6)) =
              h6Square := presentation.h6_square
        code:
          - file: KIP126/E2Computation/Source.lean
            declaration: Atom.record
          - file: KIP126/E2Computation/Source.lean
            declaration: SpherePresentation
          - file: KIP126/E2Computation/Standard.lean
            declaration: comparison_h6
          - file: KIP126/E2Computation/Standard.lean
            declaration: atom_h6
          - file: KIP126/E2Computation/Standard.lean
            declaration: h6_square
      - title: 主证明消费的是同一个 h₆²
        body: >-
          Main.h6_sq_permanent 的目标就是固定 model.classical.sphere 上、次数 (2,128) 的
          model.standardClasses.standardH6Square。主证明中的数据基底识别使用 atom_h6
          和 standardH6Square_eq_product，非零输入使用 square_nonzero。
          最终永久存活是 Main 的证明结论，没有被装进 hᵢ 的输入规格。
        code:
          - file: KIP126/Main/H6SquarePermanent.lean
            declaration: h6_sq_permanent
      - title: 已核对范围与上会讨论点
        body: >-
          已核对源码与现有公开接口，并用固定 Lean 工具链通过普通导入检查：页和次数、实例的定义相等、六个标签对应、平方及非零性质均可直接消费。
          上会确认：是否认可当前 StandardSphereClasses 指定元素、各上游接口分别提供性质与标签标定的交付方式。
          Milnor 比较、相关乘法比较及部分文献性质仍保留已有待补责任，按上游输入使用；本次不要求补齐这些底层证明，也没有修改数学接口或新增公理。
        code:
          - file: KIP126/AdamsSynthetic/Standard/Background.lean
            declaration: sphereE2_milnorEquiv
          - file: KIP126/AdamsSynthetic/Standard/Source.lean
            declaration: sphereProduct_milnor
