            url: https://applink.feishu.cn/client/chat/open?openChatId=oc_0757f47818759dc02c05b8dd370aa649&position=1569
      - title: 已公开并证明的 GL，对应 Blueprint 哪一条
        body: 对应 ProofTools 章的 “Generalized Leibniz with an arbitrary lambda level”，标签 sem:ProofTools:generalized-leibniz-at-level，是原
          Theorem 6.1 的带层修正版。Lean 公共定理为 KIP126.ProofTools.Standard.generalizedLeibnizAtLevel。它允许任意 k≥0，使用 q=n+k−1、weight=t+e(f)−k；输入一条有限带层扩张和一条无限扩张，要求实际方块的上边或左边无
          crossing，并要求传播后的实际底边无 crossing，结论是经典 d_(r+l−m)(y)=y∞。这些实际 synthetic no-crossing 不等于已经从论文原有的经典 no-crossing
          推出来。x∞、y∞ 的永久循环资格也仍是该公开定理的输入。
        snippet: |-
          q = n+k−1，w = t+e(f)−k
          d_r(x)=x∞
          d_m^(F_q)(λ^k x)=λ^(k+m−e(f))y
          无限下边扩张 + 实际上/左边 NC + 实际底边 NC
          ⇒ d_(r+l−m)(y)=y∞
        code:
          - file: KIP126/ProofTools/GeneralizedLeibnizAtLevel.lean
            declaration: generalizedLeibnizAtLevel
          - file: KIP126/ProofTools/LevelLanguage.lean
            declaration: LevelFiniteExtension
          - file: KIP126/ProofTools/LevelLanguage.lean
            declaration: LevelBottomNoCrossing
        links:
          - title: Blueprint：带任意 λ level 的广义 Leibniz
            url: https://sii-math.github.io/Kervaire126Main/#/Kervaire126#sem%3AProofTools%3Ageneralized-leibniz-at-level
          - title: Blueprint：带层扩张及实际方块条件
            url: https://sii-math.github.io/Kervaire126Main/#/Kervaire126#sem%3AProofTools%3Alevel-finite-extension
      - title: 已公开并证明的 MH，对应 Blueprint 哪一条
        body: 对应 ProofTools 章的 Theorem 6.12 “The finite-layer generalized Mahowald trick”，标签 paper:6.12；此处展示的是完整有限层修正版，原印刷版本保留在
          AimPaper 与修正记录。Lean 公共定理为 KIP126.ProofTools.Standard.generalizedMahowaldAtLevel，其完整类型由 FiniteMahowaldAtLevelStatement
          展开。它保留两个输入层 i、j、实际 no-crossing、同一组 a/b/c 代表、两条带符号像和强有限商结论，不再要求调用者另交 hRows。它输出的仍是指定有限商中的带层扩张，不能直接约去 λ 或当成经典扩张。
        snippet: |-
          k=l−e(h)，r=n+m+l
          i=j=0 时：
          x ∈ Z_(n+m+e(h))
          d_n^(f̂_r)(λ^k x)=[λ^(r′−1)y]
          r′=n−e(f)+k+1
          保留 Q_r 强有限商和 λ^k，不能直接删掉 λ^k。
        code:
          - file: KIP126/ProofTools/GeneralizedMahowald/FiniteLevelAssembly.lean
            declaration: generalizedMahowaldAtLevel
          - file: KIP126/ProofTools/GeneralizedMahowald/FiniteLevelStatement.lean
            declaration: FiniteMahowaldAtLevelStatement
        links:
          - title: Blueprint：Theorem 6.12 的完整有限层 MH 修正版
            url: https://sii-math.github.io/Kervaire126Main/#/Kervaire126#paper%3A6.12
      - title: 另有可用工具，但不能把它们当作原比较命题已完成
        body: finiteExtensionAtLevelZero 已将旧有限扩张转换成 level 0 输入，但没有比较旧、新 no-crossing。finiteLambdaDivision 对应 sem:ProofTools:finite-lambda-division：有额外目标
          λ-核 crossing 条件时，保留实际源、实际像和所需目标滤过地除 λ。它不证明原 Proposition 5.10 的 iff。有限到经典的推广还要检查保目标的相容完整提升与实际塔比较；逐页存在或源永久性本身不够。旧
          Standard.generalizedLeibniz / generalizedMahowald theorem 已经获准撤销；本次核对的是替代定理，不恢复旧断言。
        code:
          - file: KIP126/ProofTools/GeneralizedLeibnizAtLevel.lean
            declaration: finiteExtensionAtLevelZero
          - file: KIP126/ProofTools/LambdaDivision.lean
            declaration: finiteLambdaDivision
          - file: KIP126/ProofTools/LambdaDivision.lean
            declaration: FiniteLambdaKernelNoCrossing
