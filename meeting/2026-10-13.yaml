      - title: 已纳入映射：S0__S0_by_nu → 经典 ν 与合成归一化 ν
        body: 'SS 用球面到球面的乘法条目记录 ν，悬挂和次数并未完整写在 from/to 名字里。Lean 的经典 ν 是 auxiliary.nuMap: Sphere 3 → SphereSpectrum；nu_detection
          指明由 h₂ 检测。归一化后的合成 Hopf ν 属于 BiHom 3 4 S_0_0，即 S^(3,4) → S^(0,0)，其首个 λ 商对应 h₂。自然语言：这是同一个指定 Hopf 元的经典版本及归一化合成版本。model.nu
          则是合成化函子的数据，须与这个 Hopf ν 区分。原始 factor 数组照录供核对，不把数组位置自行解释成 Lean 的次数或生成元编号。'
        snippet: |-
          SS 原条目：
          {
            "factor": [
              3,
              1,
              0
            ],
            "from": "S0",
            "name": "S0__S0_by_nu",
            "to": "S0"
          }

          Lean 表示：
          model.auxiliary.nuMap : Sphere 3 ⟶ SphereSpectrum
          KIP126.Literature.Standard.normalizedNu nuCofiber_nu_exponent
            : BiHom 3 4 (S_0_0 : SyntheticSpectrum)
        code:
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: AuxiliaryData
          - file: KIP126/Literature/Standard.lean
            declaration: nu_detection
          - file: KIP126/Literature/Triangles.lean
            declaration: normalizedNu
          - file: KIP126/Literature/Standard.lean
            declaration: nuCofiber_normalized_label
      - title: 已纳入映射：S0__Cnu 与 Cnu__S0 → 底胞腔和顶胞腔
        body: SS 的 S0__Cnu 对应底胞腔包含 i；Cnu__S0 标为 top_cell，且 sus=4。Lean 中二者分别由同一 ν 的 cofibι 与 cofibδ 导出，方向为 S⁰ → Cν
          和 Cν → Σ⁴S⁰。自然语言：把球面作为 Cν 的底胞腔放进去，以及把底胞腔压掉后投到四维顶胞腔。E₂ 上的 bottom 直接取包含映射诱导的页映射；top_comparison 则明确连接映射及四次去悬挂的标签比较，仍是待证明输入。
        snippet: |-
          SS 原条目：
          {
            "factor": [
              0,
              0,
              0
            ],
            "from": "S0",
            "name": "S0__Cnu",
            "to": "Cnu"
          }
          {
            "from": "Cnu",
            "name": "Cnu__S0",
            "path": "map_AdamsSS_Cnu_to_S0_t200.db",
            "sus": 4,
            "t_max": 200,
            "to": "S0",
            "type": "top_cell"
          }

          Lean 表示：
          i = HasFunctorialCofiber.cofibι model.auxiliary.nuMap
          q = HasFunctorialCofiber.cofibδ model.auxiliary.nuMap
          model.auxiliary.nuRouteTriangle.g = i
          model.auxiliary.nuRouteTriangle.h = q
        code:
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: AuxiliaryData.nuRouteTriangle
          - file: KIP126/E2Computation/Standard.lean
            declaration: bottom
          - file: KIP126/E2Computation/Standard.lean
            declaration: top_comparison
      - title: 已纳入三角：S0__Cnu__S0 → 同一个 ν 的余纤维三角
        body: SS 以 d、i、q 三个名字组织这条 cofseq。Lean 中 nuRouteTriangle 的三个箭头直接来自 ν 及其余纤维构造，给出经典 distinguished triangle：Σ³S⁰
          → S⁰ → Cν → Σ⁴S⁰。自然语言：ν、底胞腔包含和顶胞腔投影构成同一条余纤维序列。合成归一化所需的指数为 ν:1、底胞腔:0、顶胞腔:0；三角相容性由 nuCofiber_triangle 提供，底层比较尚待证明。
        snippet: |-
          SS 原条目：
          {
            "d": "S0__S0_by_nu",
            "deduce": "on",
            "i": "S0__Cnu",
            "name": "S0__Cnu__S0",
            "path": "cofseq_S0__Cnu__S0.db",
            "q": "Cnu__S0"
          }

          Lean 表示：
          model.auxiliary.nuRouteTriangle
          nuCofiber_nu_exponent
          nuCofiber_bottom_exponent
          nuCofiber_top_exponent
          nuCofiber_triangle
        code:
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: AuxiliaryData.nuRouteTriangle
          - file: KIP126/Literature/Standard.lean
            declaration: nuCofiber_nu_exponent
          - file: KIP126/Literature/Standard.lean
            declaration: nuCofiber_bottom_exponent
          - file: KIP126/Literature/Standard.lean
            declaration: nuCofiber_top_exponent
          - file: KIP126/Literature/Standard.lean
            declaration: nuCofiber_triangle
      - title: 已纳入映射：S0__tmf → 单位 / Hurewicz 映射
        body: 'SS 中这条映射指向单独的 t≤261 映射数据库。Lean 中 tmfUnit: S⁰ → tmf 是所选代数结构的单位，tmfUnit_agrees 将它经 tmfIso 转到 detectorUnit。自然语言：把球面的稳定同伦类送入
          tmf；主证明中的检测图必须使用这一个指定单位。已表达对象和单位的一致性接口，并不等于已把原数据库逐条比较证明完成。'
        snippet: |-
          SS 原条目：
          {
            "from": "S0",
            "name": "S0__tmf",
            "path": "map_AdamsSS_S0_to_tmf_t261.db",
            "t_max": 261,
            "to": "tmf"
          }

          Lean 表示：
          tmfUnit : SphereSpectrum ⟶ tmf
          tmfUnit ≫ tmfIso.hom = model.auxiliary.detectorUnit
        code:
          - file: KIP126/Literature/Standard.lean
            declaration: tmfUnit
          - file: KIP126/Literature/Standard.lean
            declaration: tmfUnit_agrees
      - title: 三个具名经典谱之外，主证明还使用哪些派生对象
        body: ClassicalObject.shift 提供经典悬挂；SyntheticObject 提供合成球面、经典对象的合成像、双次数悬挂和有限 λ 商。因此“三个对象”只是在原配置的 49 个具名基本谱中选出三个，并非整个形式化中只存在三个对象。Main
          还会取这些对象的商、悬挂及局部余纤维。SS 的 rings/modules 名单也不是这些合成操作的完整目录。球面上的 η、θ₅ 等映射或类已有接口；这本身不要求把 Ceta、Ctheta5 作为具名计算对象引入。
        snippet: |-
          Lean 派生对象：
          ClassicalObject.shift n X
          SyntheticObject.sphere
          SyntheticObject.nu X
          SyntheticObject.shift (p,q) X
          SyntheticObject.quotient n X
        code:
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: ClassicalObject.obj
          - file: KIP126/AdamsSynthetic/Configuration.lean
            declaration: SyntheticObject.obj
          - file: KIP126/Literature/Standard.lean
            declaration: eta
          - file: KIP126/Literature/Standard.lean
            declaration: theta5
      - title: 未逐一纳入的对象：CW_ 前缀对象（18 个）
        body: 以下逐项照录 ss.json 中的 name 与 path，所有条目的 over 均为 S0。当前所选主证明路线没有为它们逐一建立同名计算对象及数据库绑定；当前判断是 Main 接受上游 E₂ / 后续
          Adams 计算和文献结果后，无需直接调用这些具名谱。这项取舍提交会上确认；用于生成或证明上游结果的辅助计算仍可能需要它们，不把它们判为无用。
        snippet: |-
          CW_2_eta  →  CW_2_eta_AdamsSS_t200.db
          CW_eta_2  →  CW_eta_2_AdamsSS_t200.db
          CW_eta_nu  →  CW_eta_nu_AdamsSS_t200.db
