name: PR auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

# This workflow never checks out or executes pull request code.
permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable auto-merge
    # Only non-draft pull requests from branches in this repository opt in.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Generate repository-scoped integration token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.INTEGRATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enqueue or merge when required checks and branch protection allow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          owner="${GH_REPO%%/*}"
          repository="${GH_REPO#*/}"
          queue_id=$(gh api graphql -f owner="$owner" -f name="$repository" \
            -f 'query=query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { mergeQueue(branch: "main") { id } } }' \
            --jq '.data.repository.mergeQueue.id // empty')
          if [[ -n "$queue_id" ]]; then
            gh pr merge "$PR_NUMBER" --auto --match-head-commit "$PR_HEAD_SHA"
          else
            gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$PR_HEAD_SHA"
          fi
