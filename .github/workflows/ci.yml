name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Each queue ref is independent; a PR/main run cannot cancel a queue check.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI event
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Keep PR and main checks; avoid duplicate develop pushes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-cache.py plan

  lean:
    needs: plan
    # A skipped develop push must not publish a skipped/successful required PR check.
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'Develop checks' || 'Lean checks' }}
    # API/setup failures fail open to a real build, never to a missing validation.
    if: ${{ !cancelled() && needs.plan.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '2'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Identify all tracked inputs
        id: inputs
        # Includes interfaces, obligation registry, scripts and workflow configuration.
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Test CI cache and event policy
        run: python3 -m unittest discover -s Tests -p 'test_ci_cache.py'

      - name: Restore pinned dependencies
        id: dependencies
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-v2

      - name: Restore project build cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lake-project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-v2-${{ steps.inputs.outputs.tree }}-complete
          restore-keys: |
            lake-project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-v2-${{ steps.inputs.outputs.tree }}-
            lake-project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-v2-

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Fetch only imported Mathlib dependencies
        # The environment-keyed cache can predate newly imported modules.
        # Cache get fills missing imports and reuses files already present.
        run: |
          lake env python3 scripts/mathlib-cache-roots.py > "$RUNNER_TEMP/mathlib-roots.txt"
          mapfile -t mathlib_roots < "$RUNNER_TEMP/mathlib-roots.txt"
          if (( ${#mathlib_roots[@]} )); then
            lake exe cache get "${mathlib_roots[@]}"
          fi

      - name: Save pinned dependencies once per environment
        if: steps.dependencies.outputs.cache-hit != 'true'
        timeout-minutes: 8
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Reuse a verified Release build across branches
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-cache.py restore-release

      - name: Build all modules and checks
        id: build
        timeout-minutes: 60
        # Always run, including exact cache hits; Lake decides what to rebuild.
        run: lake build

      - name: Save complete project build
        if: steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Preserve partial build after failure
        if: >-
          always() &&
          (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled') &&
          steps.inputs.outputs.tree != '' && hashFiles('.lake/build/**/*.trace') != ''
        timeout-minutes: 8
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          # Best effort: hard cancellation or a lost runner can prevent saving.
          key: lake-project-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-v2-${{ steps.inputs.outputs.tree }}-progress-${{ github.run_id }}-${{ github.run_attempt }}
