name: Blueprint publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-export
  cancel-in-progress: true

jobs:
  export:
    name: Export main Blueprint
    if: github.ref == 'refs/heads/main'
    # An independent slot cannot be blocked by Lean PR/merge-queue builds.
    runs-on: kip126-blueprint
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: false

      - name: Clean source while retaining native diagram cache
        run: git clean -ffdx -e .lake -e .lake/

      - name: Verify preinstalled pinned export tools
        run: |
          "$BLUEPRINT_TOOLS/venv/bin/python" .github/runner/check-blueprint-env.py
          echo "$BLUEPRINT_TOOLS/venv/bin" >> "$GITHUB_PATH"

      - name: Test native synchronization and retained chapter boundaries
        run: python -m unittest discover -s Tests -p 'test_blueprint*.py'

      - name: Export authored Blueprint with native hgraph
        run: python scripts/publish-blueprint.py

      - name: Include native live-server project snapshot
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          workspace = Path('.lake/blueprint/workspace')
          runtime = Path('_site/.hgraph-runtime')
          runtime.mkdir()
          shutil.copy2(workspace / 'config.yaml', runtime / 'config.yaml')
          shutil.copytree(workspace / 'site', runtime / 'site')
          shutil.copytree(workspace / 'Kervaire126', runtime / 'Kervaire126')
          PYTHON

      - name: Publish directly to Hong Kong and verify live site
        run: python .github/runner/publish-blueprint.py
