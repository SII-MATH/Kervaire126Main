name: Blueprint export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-export
  cancel-in-progress: true

jobs:
  export:
    name: Export main Blueprint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out pinned public hgraph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SII-MATH/hgraph
          ref: c33cf070fb664360e8822fd2834b39d15ebd8d8e
          path: .blueprint-tools/hgraph
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install diagram tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures lmodern dvisvgm graphviz

      - name: Install pinned native hgraph
        run: |
          python -m venv "$RUNNER_TEMP/blueprint-env"
          "$RUNNER_TEMP/blueprint-env/bin/python" -m pip install --disable-pip-version-check 'PyYAML==6.0.1'
          "$RUNNER_TEMP/blueprint-env/bin/python" -m pip install --disable-pip-version-check --no-deps .blueprint-tools/hgraph
          echo "$RUNNER_TEMP/blueprint-env/bin" >> "$GITHUB_PATH"

      - name: Test native synchronization and retained chapter boundaries
        run: python -m unittest discover -s Tests -p 'test_blueprint*.py'

      - name: Export authored Blueprint with native hgraph
        run: python scripts/publish-blueprint.py

      - name: Upload website only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
