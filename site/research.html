<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research · Kervaire 126</title>
  <link rel="stylesheet" href="proposals.css">
  <link rel="stylesheet" href="research.css">
  <script src="../hgraph-custom-page.js" defer></script>
  <script src="research.js" defer></script>
  <!-- RESEARCH_MATH -->
</head>
<body>
<main class="research-page">
  <header class="research-header">
    <p class="research-eyebrow">Kervaire 126 · Research</p>
    <h1>研究结果</h1>
    <div class="research-header-meta"><span><!-- RESEARCH_COUNT --> 份研究报告</span></div>
  </header>
  <aside class="research-note">独立数学复核、Lean 形式化与文献新颖性分别记录。局部结论的成立不表示原开放问题已经解决。</aside>
  <form class="research-filters" role="search">
    <label>搜索报告<input id="research-search" type="search" placeholder="结论、证明、来源、未决问题" autocomplete="off"></label>
    <label>研究方向<select id="research-topic"><option value="">全部方向</option></select></label>
    <label>研究状态<select id="research-status">
      <option value="">全部状态</option>
      <option value="reviewed-informal">已独立复核（非形式化）</option>
      <option value="conditional">条件性结果</option>
      <option value="draft">研究草稿</option>
    </select></label>
    <button type="reset">重置</button>
  </form>
  <p id="research-results" role="status" aria-live="polite"></p>
  <div id="research-empty" hidden>没有匹配的研究报告。</div>
  <div class="research-records"><!-- RESEARCH_CARDS --></div>
</main>
</body>
</html>
